name: Check upstream releases

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copr-upstream-release
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream releases and update RPM specs
        id: update
        run: |
          changed_recipes=()
          for dir in recipes/*/; do
            [ -d "$dir" ] || continue
            recipe="$(basename "$dir")"
            spec="${dir}${recipe}.spec"
            updater="${dir}update.py"
            if [ ! -f "$spec" ] || [ ! -f "$updater" ]; then
              echo "Skipping ${dir}: missing ${recipe}.spec or update.py"
              continue
            fi
            echo "=== Checking ${recipe} ==="
            python3 "$updater"
            if ! git diff --quiet -- "$spec"; then
              changed_recipes+=("$recipe")
            fi
          done

          if [ "${#changed_recipes[@]}" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "recipes=${changed_recipes[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure COPR credentials
        if: steps.update.outputs.changed == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "Missing COPR_CONFIG repository secret" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      - name: Install COPR CLI
        if: steps.update.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install --disable-pip-version-check copr-cli
          echo "$RUNNER_TEMP/copr-venv/bin" >> "$GITHUB_PATH"

      - name: Commit updated specs and submit COPR builds
        if: steps.update.outputs.changed == 'true'
        env:
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
          REPOSITORY: ${{ github.repository }}
          CHANGED_RECIPES: ${{ steps.update.outputs.recipes }}
        run: |
          if [ -z "$COPR_PROJECT" ]; then
            echo "Missing COPR_PROJECT repository variable (for example: username/kiri)" >&2
            exit 1
          fi
          owner="${COPR_PROJECT%%/*}"
          project="${COPR_PROJECT#*/}"
          if [ "$owner" = "$project" ] || [ -z "$owner" ] || [ -z "$project" ]; then
            echo "COPR_PROJECT must use owner/project format" >&2
            exit 1
          fi

          # Read the project's enabled chroots directly from COPR. This keeps
          # the workflow aligned with project settings without a second list
          # in GitHub Actions variables.
          project_json="$(curl --fail --silent --show-error \
            "https://copr.fedorainfracloud.org/api_3/project?ownername=${owner}&projectname=${project}")"
          mapfile -t chroots < <(
            jq -er '
              (.output.project // .output // .) as $project
              | ($project.chroot_repos // $project.chroots // {})
              | if type == "object" then keys[]
                elif type == "array" then .[]
                else empty
                end
            ' <<< "$project_json"
          )
          if [ "${#chroots[@]}" -eq 0 ]; then
            echo "COPR returned no configured chroots for ${COPR_PROJECT}; refusing to submit a build" >&2
            jq . <<< "$project_json" >&2
            exit 1
          fi

          args=()
          for chroot in "${chroots[@]}"; do
            args+=(--chroot "$chroot")
          done
          printf 'Building for project chroots: %s\n' "${chroots[*]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for recipe in $CHANGED_RECIPES; do
            spec="recipes/${recipe}/${recipe}.spec"
            version="$(sed -n 's/^Version:[[:space:]]*//p' "$spec")"
            git add "$spec"
            git commit -m "chore(${recipe}): package ${recipe} ${version}"
            git push
            sha="$(git rev-parse HEAD)"

            copr-cli buildscm \
              --clone-url "https://github.com/${REPOSITORY}.git" \
              --commit "$sha" \
              --subdir "recipes/${recipe}" \
              --spec "${recipe}.spec" \
              --background \
              "${args[@]}" \
              "$COPR_PROJECT"
          done
